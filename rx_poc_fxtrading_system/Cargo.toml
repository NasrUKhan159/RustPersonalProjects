[package]
name = "rx_poc_fxtrading_system"
version = "0.1.0"
edition = "2021"

[dependencies]
# The async runtime for our reactive streams
tokio = { version = "1", features = ["full"] }
# Precision decimals for risk and trade calculations
rust_decimal = "1.34"
rust_decimal_macros = "1.34"
# Random data for our tick generator
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"